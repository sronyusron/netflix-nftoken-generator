<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>airon NFToken Generator</title>
  <meta name="description" content="Generate Netflix login token dari cookies">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid #21262d;
    }

    .header-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 0.75rem;
      border-radius: 50%;
      background: linear-gradient(135deg, #da3633, #f78166);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      box-shadow: 0 0 12px rgba(218, 54, 51, 0.3);
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #f0f6fc;
      margin-bottom: 0.25rem;
    }

    .header p {
      color: #8b949e;
      font-size: 0.875rem;
    }

    /* Card */
    .card {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      margin-bottom: 1rem;
    }

    .card-header {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #21262d;
      background-color: #1c2128;
      border-radius: 6px 6px 0 0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .card-header .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .card-header .dot-red { background: #da3633; }
    .card-header .dot-yellow { background: #d29922; }
    .card-header .dot-green { background: #3fb950; }

    .card-header span {
      color: #8b949e;
      font-size: 0.8rem;
      font-family: 'JetBrains Mono', monospace;
    }

    .card-body {
      padding: 1rem;
    }

    .card-body label {
      display: block;
      color: #c9d1d9;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
    }

    .card-body textarea {
      width: 100%;
      height: 200px;
      background-color: #0d1117;
      color: #7ee787;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      padding: 0.75rem;
      border: 1px solid #30363d;
      border-radius: 6px;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
      line-height: 1.5;
    }

    .card-body textarea:focus {
      border-color: #58a6ff;
      box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.1);
    }

    .card-body textarea::placeholder {
      color: #484f58;
    }

    /* Buttons */
    .btn-group {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }

    .btn {
      padding: 0.5rem 1rem;
      border: 1px solid #30363d;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .btn-secondary {
      background-color: #21262d;
      color: #c9d1d9;
    }

    .btn-secondary:hover {
      background-color: #30363d;
      border-color: #8b949e;
    }

    .btn-primary {
      background: linear-gradient(180deg, #da3633, #b62324);
      color: #ffffff;
      border-color: #da3633;
      font-weight: 600;
    }

    .btn-primary:hover {
      background: linear-gradient(180deg, #f85149, #da3633);
    }

    .btn-primary:disabled {
      background: #21262d;
      border-color: #30363d;
      color: #484f58;
      cursor: not-allowed;
    }

    .btn-success {
      background: linear-gradient(180deg, #238636, #196c2e);
      color: #ffffff;
      border-color: #238636;
    }

    .btn-success:hover {
      background: linear-gradient(180deg, #2ea043, #238636);
    }

    .btn-success.copied {
      background: linear-gradient(180deg, #1a7f37, #196c2e);
    }

    .btn-link {
      background: linear-gradient(180deg, #1f6feb, #1158c7);
      color: #ffffff;
      border-color: #1f6feb;
    }

    .btn-link:hover {
      background: linear-gradient(180deg, #388bfd, #1f6feb);
    }

    /* Result */
    .result-card {
      display: none;
    }

    .result-card.visible {
      display: block;
    }

    .result-card .card-header {
      background-color: #1c2128;
    }

    .result-card.success .card-header {
      border-bottom-color: #238636;
    }

    .result-card.error .card-header {
      border-bottom-color: #da3633;
    }

    .result-label {
      color: #8b949e;
      font-size: 0.7rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.35rem;
    }

    .result-link-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .result-link-input {
      flex: 1;
      background-color: #0d1117;
      color: #58a6ff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      padding: 0.5rem 0.75rem;
      border: 1px solid #30363d;
      border-radius: 6px;
      outline: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .result-expiry {
      color: #3fb950;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
    }

    .result-title {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .result-title.success { color: #3fb950; }
    .result-title.error { color: #f85149; }

    .error-msg {
      color: #f85149;
      font-size: 0.85rem;
      padding: 0.5rem 0.75rem;
      background: rgba(248, 81, 73, 0.1);
      border: 1px solid rgba(248, 81, 73, 0.2);
      border-radius: 6px;
    }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid #484f58;
      border-top-color: #f85149;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Footer */
    .footer {
      text-align: center;
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid #21262d;
      color: #484f58;
      font-size: 0.75rem;
    }

    .footer a {
      color: #58a6ff;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .footer p + p {
      margin-top: 0.25rem;
    }

    /* Responsive */
    @media (max-width: 640px) {
      .header h1 {
        font-size: 1.25rem;
      }

      .btn-group {
        flex-direction: column;
      }

      .btn {
        justify-content: center;
      }

      .result-link-row {
        flex-direction: column;
      }

      .result-link-input {
        width: 100%;
      }

      .result-link-row .btn {
        width: 100%;
        justify-content: center;
      }
    }

    /* Scrollbar */
    textarea::-webkit-scrollbar {
      width: 6px;
    }

    textarea::-webkit-scrollbar-track {
      background: #0d1117;
    }

    textarea::-webkit-scrollbar-thumb {
      background: #30363d;
      border-radius: 3px;
    }

    textarea::-webkit-scrollbar-thumb:hover {
      background: #484f58;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="header-icon">⚡</div>
      <h1>airon NFToken Generator</h1>
      <p>Generate Netflix login token dari cookies</p>
    </div>

    <!-- Input Card -->
    <div class="card">
      <div class="card-header">
        <div class="dot dot-red"></div>
        <div class="dot dot-yellow"></div>
        <div class="dot dot-green"></div>
        <span>cookies.json</span>
      </div>
      <div class="card-body">
        <label for="cookie-input">Masukkan Cookies Netflix (JSON, Netscape, atau Raw string):</label>
        <textarea
          id="cookie-input"
          placeholder="Paste cookies Netflix kamu di sini...&#10;&#10;Format: JSON array, Netscape tab-separated, atau raw string.&#10;Pastikan ada cookie NetflixId."></textarea>

        <div class="btn-group">
          <button class="btn btn-secondary" onclick="handleClear()">Clear</button>
          <button class="btn btn-primary" id="btn-generate" onclick="handleGenerate()">Generate Token</button>
        </div>
      </div>
    </div>

    <!-- Result Card -->
    <div class="card result-card" id="result-section">
      <div class="card-header">
        <div class="dot dot-green"></div>
        <span>output</span>
      </div>
      <div class="card-body" id="result-content"></div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <p>airon NFToken Generator &middot; For educational purposes only</p>
    </div>
  </div>

  <script>
    function parseCookies(input) {
      const trimmed = input.trim();
      if (trimmed.startsWith('[') || trimmed.startsWith('{')) {
        try {
          let parsed = JSON.parse(trimmed);
          if (!Array.isArray(parsed)) parsed = [parsed];
          return parsed.map(cookie => ({
            name: cookie.name || cookie.Name || '',
            value: cookie.value || cookie.Value || '',
            expires: cookie.expires || cookie.expirationDate || cookie.Expires || 0,
          }));
        } catch (e) {}
      }
      const lines = trimmed.split('\n').filter(line => line.trim() && !line.startsWith('#'));
      if (lines.some(line => line.split('\t').length >= 7)) {
        const cookies = [];
        for (const line of lines) {
          const parts = line.split('\t');
          if (parts.length >= 7) {
            cookies.push({ name: parts[5].trim(), value: parts[6].trim(), expires: parseInt(parts[4].trim()) || 0 });
          }
        }
        if (cookies.length > 0) return cookies;
      }
      if (trimmed.includes('=') && !trimmed.includes('\t')) {
        const pairs = trimmed.split(';').map(p => p.trim()).filter(Boolean);
        const cookies = [];
        for (const pair of pairs) {
          const eqIndex = pair.indexOf('=');
          if (eqIndex > 0) {
            cookies.push({ name: pair.substring(0, eqIndex).trim(), value: pair.substring(eqIndex + 1).trim(), expires: 0 });
          }
        }
        if (cookies.length > 0) return cookies;
      }
      return [];
    }

    function handleGenerate() {
      const input = document.getElementById('cookie-input').value;
      const resultSection = document.getElementById('result-section');
      const resultContent = document.getElementById('result-content');
      const btnGenerate = document.getElementById('btn-generate');

      if (!input.trim()) {
        resultSection.className = 'card result-card visible';
        resultSection.querySelector('.card-header .dot').className = 'dot dot-red';
        resultContent.innerHTML = '<div class="result-title error">&#10060; Error</div><div class="error-msg">Masukkan cookies terlebih dahulu.</div>';
        return;
      }

      btnGenerate.disabled = true;
      btnGenerate.innerHTML = '<span class="spinner"></span> Connecting to Netflix...';

      fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cookies: input.trim() }),
      })
      .then(r => r.json())
      .then(data => {
        if (data.loginLink || data.token) {
          const link = data.loginLink || ('https://netflix.com/?nftoken=' + data.token);
          resultSection.className = 'card result-card visible success';
          resultSection.querySelector('.card-header .dot').className = 'dot dot-green';
          resultContent.innerHTML = `
            <div class="result-title success">&#9989; Token Generated</div>
            <div class="result-label">LOGIN LINK</div>
            <div class="result-link-row">
              <input type="text" class="result-link-input" id="link-output" value="${link}" readonly>
              <button class="btn btn-success" id="btn-copy" onclick="handleCopy()">Copy</button>
              <button class="btn btn-link" onclick="handleOpen()">Open</button>
            </div>
            <div class="result-label">EXPIRY</div>
            <div class="result-expiry">${data.expiry || 'Unknown'}</div>
          `;
        } else {
          resultSection.className = 'card result-card visible error';
          resultSection.querySelector('.card-header .dot').className = 'dot dot-red';
          resultContent.innerHTML = `<div class="result-title error">&#10060; Error</div><div class="error-msg">${data.error || 'Gagal generate token.'}</div>`;
        }
        btnGenerate.disabled = false;
        btnGenerate.innerHTML = 'Generate Token';
      })
      .catch(err => {
        resultSection.className = 'card result-card visible error';
        resultSection.querySelector('.card-header .dot').className = 'dot dot-red';
        resultContent.innerHTML = '<div class="result-title error">&#10060; Connection Error</div><div class="error-msg">Gagal menghubungi server. Pastikan api/generate.js sudah di-deploy.</div>';
        btnGenerate.disabled = false;
        btnGenerate.innerHTML = 'Generate Token';
      });
    }

    function handleClear() {
      document.getElementById('cookie-input').value = '';
      document.getElementById('result-section').className = 'card result-card';
      document.getElementById('result-content').innerHTML = '';
    }

    function handleCopy() {
      const linkInput = document.getElementById('link-output');
      const btnCopy = document.getElementById('btn-copy');
      if (linkInput) {
        navigator.clipboard.writeText(linkInput.value).then(() => {
          btnCopy.textContent = 'Copied!';
          btnCopy.classList.add('copied');
          setTimeout(() => { btnCopy.textContent = 'Copy'; btnCopy.classList.remove('copied'); }, 2000);
        }).catch(() => {
          linkInput.select();
          document.execCommand('copy');
          btnCopy.textContent = 'Copied!';
          btnCopy.classList.add('copied');
          setTimeout(() => { btnCopy.textContent = 'Copy'; btnCopy.classList.remove('copied'); }, 2000);
        });
      }
    }

    function handleOpen() {
      const linkInput = document.getElementById('link-output');
      if (linkInput && linkInput.value) window.open(linkInput.value, '_blank');
    }

    document.addEventListener('keydown', function(e) {
      if (e.ctrlKey && e.key === 'Enter') handleGenerate();
    });
  </script>
</body>
</html>
