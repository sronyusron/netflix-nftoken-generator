<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>airon NFToken Generator</title>
  <meta name="description" content="Ubah cookies Netflix kamu menjadi link login langsung instan">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background: linear-gradient(135deg, #1a0a0a 0%, #2d0000 30%, #1a0a0a 60%, #0a0a1a 100%);
      color: #ffffff;
      min-height: 100vh;
      padding: 2rem 1rem;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(ellipse at 20% 50%, rgba(255, 50, 50, 0.05) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(255, 200, 50, 0.03) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 80%, rgba(50, 150, 255, 0.03) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .header .arc-reactor {
      width: 60px;
      height: 60px;
      margin: 0 auto 1rem;
      border-radius: 50%;
      background: radial-gradient(circle, #7df9ff 0%, #00bfff 30%, #0080ff 60%, #003366 100%);
      box-shadow: 
        0 0 20px #00bfff,
        0 0 40px rgba(0, 191, 255, 0.5),
        0 0 60px rgba(0, 191, 255, 0.3),
        inset 0 0 15px rgba(255, 255, 255, 0.3);
      animation: pulse 2s ease-in-out infinite;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .arc-reactor::after {
      content: '';
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 0%, #7df9ff 50%, transparent 100%);
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 20px #00bfff, 0 0 40px rgba(0, 191, 255, 0.5), 0 0 60px rgba(0, 191, 255, 0.3); }
      50% { box-shadow: 0 0 30px #00bfff, 0 0 60px rgba(0, 191, 255, 0.6), 0 0 80px rgba(0, 191, 255, 0.4); }
    }

    .header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      background: linear-gradient(90deg, #ff4444, #ffaa00, #ff4444);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: none;
      letter-spacing: 1px;
    }

    .header p {
      color: #aaa;
      font-size: 0.95rem;
    }

    .input-section {
      background: linear-gradient(145deg, #1c1c2e, #2a1515);
      border: 1px solid #c0392b44;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      position: relative;
      overflow: hidden;
    }

    .input-section::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #ff4444, #ffaa00, #ff4444, transparent);
    }

    .input-section label {
      display: block;
      color: #ddd;
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 0.75rem;
    }

    .input-section textarea {
      width: 100%;
      height: 220px;
      background-color: #0a0a14;
      color: #00ff88;
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
      padding: 1rem;
      border: 1px solid #333;
      border-radius: 8px;
      resize: none;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .input-section textarea:focus {
      border-color: #ff4444;
      box-shadow: 0 0 10px rgba(255, 68, 68, 0.2);
    }

    .input-section textarea::placeholder {
      color: #555;
    }

    .buttons {
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
      margin-top: 1rem;
    }

    .btn {
      padding: 0.7rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn-clear {
      background: linear-gradient(145deg, #2a2a3a, #1a1a2a);
      color: #ccc;
      border: 1px solid #444;
    }

    .btn-clear:hover {
      background: linear-gradient(145deg, #3a3a4a, #2a2a3a);
      border-color: #666;
    }

    .btn-generate {
      background: linear-gradient(145deg, #c0392b, #e74c3c);
      color: #fff;
      border: 1px solid #ff4444;
      box-shadow: 0 0 15px rgba(231, 76, 60, 0.3);
    }

    .btn-generate:hover {
      background: linear-gradient(145deg, #e74c3c, #ff5555);
      box-shadow: 0 0 25px rgba(231, 76, 60, 0.5);
      transform: translateY(-1px);
    }

    .btn-generate:disabled {
      background: #3a1a1a;
      border-color: #552222;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    .btn-copy {
      background: linear-gradient(145deg, #f39c12, #e67e22);
      color: #000;
      padding: 0.6rem 1rem;
      font-size: 0.85rem;
      font-weight: 700;
      border: 1px solid #ffaa00;
    }

    .btn-copy:hover {
      background: linear-gradient(145deg, #f1c40f, #f39c12);
      box-shadow: 0 0 15px rgba(243, 156, 18, 0.4);
    }

    .btn-copy.copied {
      background: linear-gradient(145deg, #27ae60, #2ecc71);
      border-color: #2ecc71;
    }

    .btn-open {
      background: linear-gradient(145deg, #2980b9, #3498db);
      color: #fff;
      padding: 0.6rem 1rem;
      font-size: 0.85rem;
      border: 1px solid #3498db;
    }

    .btn-open:hover {
      background: linear-gradient(145deg, #3498db, #5dade2);
      box-shadow: 0 0 15px rgba(52, 152, 219, 0.4);
    }

    .result-section {
      background: linear-gradient(145deg, #1c1c2e, #1a2a1a);
      border: 1px solid #2ecc7144;
      border-radius: 12px;
      padding: 1.5rem;
      display: none;
      position: relative;
      overflow: hidden;
    }

    .result-section::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #00ff88, #00bfff, #00ff88, transparent);
    }

    .result-section.visible {
      display: block;
    }

    .result-section.error {
      background: linear-gradient(145deg, #2a1515, #1c1c2e);
      border-color: #c0392b44;
    }

    .result-section.error::before {
      background: linear-gradient(90deg, transparent, #ff4444, #ff0000, #ff4444, transparent);
    }

    .result-title {
      color: #ffaa00;
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    .result-label {
      color: #999;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }

    .link-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.2rem;
    }

    .link-input {
      flex: 1;
      background-color: #0a0a14;
      color: #7df9ff;
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
      padding: 0.75rem 1rem;
      border: 1px solid #333;
      border-radius: 8px;
      outline: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .expiry-value {
      color: #00ff88;
      font-size: 1.1rem;
      font-weight: 700;
      text-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
    }

    .error-message {
      color: #ff6b6b;
      font-size: 0.95rem;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #ffaa00;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .footer {
      text-align: center;
      margin-top: 2rem;
      color: #555;
      font-size: 0.75rem;
    }

    .footer p + p {
      margin-top: 0.3rem;
    }

    .footer .tagline {
      color: #c0392b;
      font-style: italic;
    }

    @media (max-width: 640px) {
      .header h1 {
        font-size: 1.5rem;
      }

      .buttons {
        flex-direction: column;
      }

      .btn {
        justify-content: center;
      }

      .link-row {
        flex-direction: column;
      }

      .link-input {
        width: 100%;
      }

      .link-row .btn {
        width: 100%;
      }
    }

    textarea::-webkit-scrollbar {
      width: 6px;
    }

    textarea::-webkit-scrollbar-track {
      background: #0a0a14;
    }

    textarea::-webkit-scrollbar-thumb {
      background: #c0392b;
      border-radius: 3px;
    }

    textarea::-webkit-scrollbar-thumb:hover {
      background: #e74c3c;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="arc-reactor"></div>
      <h1>airon NFToken Generator</h1>
      <p>Ubah cookies Netflix kamu menjadi link login langsung instan</p>
    </div>

    <div class="input-section">
      <label for="cookie-input">Masukkan Cookies Netflix (Raw string, JSON, atau Netscape format):</label>
      <textarea
        id="cookie-input"
        placeholder="Paste semua cookies Netflix kamu di sini...

Pastikan ada cookie NetflixId dan SecureNetflixId.
Format yang didukung: JSON array, Netscape, atau Raw string."></textarea>

      <div class="buttons">
        <button class="btn btn-clear" onclick="handleClear()">Bersihkan</button>
        <button class="btn btn-generate" id="btn-generate" onclick="handleGenerate()">Generate Link 🚀</button>
      </div>
    </div>

    <div class="result-section" id="result-section">
      <div id="result-content"></div>
    </div>

    <div class="footer">
      <p class="tagline">"I am Iron Man."</p>
      <p>airon NFToken Generator - Web Version</p>
      <p>Tool ini hanya untuk tujuan edukasi.</p>
    </div>
  </div>

  <script>
    function parseCookies(input) {
      const trimmed = input.trim();
      if (trimmed.startsWith('[') || trimmed.startsWith('{')) {
        try {
          let parsed = JSON.parse(trimmed);
          if (!Array.isArray(parsed)) parsed = [parsed];
          return parsed.map(cookie => ({
            name: cookie.name || cookie.Name || '',
            value: cookie.value || cookie.Value || '',
            expires: cookie.expires || cookie.expirationDate || cookie.Expires || 0,
          }));
        } catch (e) {}
      }
      const lines = trimmed.split('\n').filter(line => line.trim() && !line.startsWith('#'));
      if (lines.some(line => line.split('\t').length >= 7)) {
        const cookies = [];
        for (const line of lines) {
          const parts = line.split('\t');
          if (parts.length >= 7) {
            cookies.push({ name: parts[5].trim(), value: parts[6].trim(), expires: parseInt(parts[4].trim()) || 0 });
          }
        }
        if (cookies.length > 0) return cookies;
      }
      if (trimmed.includes('=') && !trimmed.includes('\t')) {
        const pairs = trimmed.split(';').map(p => p.trim()).filter(Boolean);
        const cookies = [];
        for (const pair of pairs) {
          const eqIndex = pair.indexOf('=');
          if (eqIndex > 0) {
            cookies.push({ name: pair.substring(0, eqIndex).trim(), value: pair.substring(eqIndex + 1).trim(), expires: 0 });
          }
        }
        if (cookies.length > 0) return cookies;
      }
      return [];
    }

    function handleGenerate() {
      const input = document.getElementById('cookie-input').value;
      const resultSection = document.getElementById('result-section');
      const resultContent = document.getElementById('result-content');
      const btnGenerate = document.getElementById('btn-generate');

      if (!input.trim()) {
        resultSection.className = 'result-section visible error';
        resultContent.innerHTML = '<h2 class="result-title">Error</h2><p class="error-message">Masukkan cookies terlebih dahulu!</p>';
        return;
      }

      btnGenerate.disabled = true;
      btnGenerate.innerHTML = '<span class="spinner"></span> Menghubungi Netflix...';

      fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cookies: input.trim() }),
      })
      .then(r => r.json())
      .then(data => {
        if (data.loginLink || data.token) {
          const link = data.loginLink || ('https://netflix.com/?nftoken=' + data.token);
          resultSection.className = 'result-section visible';
          resultContent.innerHTML = `
            <h2 class="result-title">Hasil Generate</h2>
            <p class="result-label">Link Login Otomatis</p>
            <div class="link-row">
              <input type="text" class="link-input" id="link-output" value="${link}" readonly>
              <button class="btn btn-copy" id="btn-copy" onclick="handleCopy()">Salin</button>
              <button class="btn btn-open" onclick="handleOpen()">Buka</button>
            </div>
            <p class="result-label">Masa Berlaku (Expiry)</p>
            <p class="expiry-value">${data.expiry || 'Tidak diketahui'}</p>
          `;
        } else {
          resultSection.className = 'result-section visible error';
          resultContent.innerHTML = `<h2 class="result-title">Error</h2><p class="error-message">${data.error || 'Gagal generate token.'}</p>`;
        }
        btnGenerate.disabled = false;
        btnGenerate.innerHTML = 'Generate Link 🚀';
      })
      .catch(err => {
        resultSection.className = 'result-section visible error';
        resultContent.innerHTML = '<h2 class="result-title">Error</h2><p class="error-message">Gagal menghubungi server. Pastikan file api/generate.js sudah di-deploy.</p>';
        btnGenerate.disabled = false;
        btnGenerate.innerHTML = 'Generate Link 🚀';
      });
    }

    function handleClear() {
      document.getElementById('cookie-input').value = '';
      document.getElementById('result-section').className = 'result-section';
      document.getElementById('result-content').innerHTML = '';
    }

    function handleCopy() {
      const linkInput = document.getElementById('link-output');
      const btnCopy = document.getElementById('btn-copy');
      if (linkInput) {
        navigator.clipboard.writeText(linkInput.value).then(() => {
          btnCopy.textContent = 'Tersalin!';
          btnCopy.classList.add('copied');
          setTimeout(() => { btnCopy.textContent = 'Salin'; btnCopy.classList.remove('copied'); }, 2000);
        }).catch(() => {
          linkInput.select();
          document.execCommand('copy');
          btnCopy.textContent = 'Tersalin!';
          btnCopy.classList.add('copied');
          setTimeout(() => { btnCopy.textContent = 'Salin'; btnCopy.classList.remove('copied'); }, 2000);
        });
      }
    }

    function handleOpen() {
      const linkInput = document.getElementById('link-output');
      if (linkInput && linkInput.value) window.open(linkInput.value, '_blank');
    }

    document.addEventListener('keydown', function(e) {
      if (e.ctrlKey && e.key === 'Enter') handleGenerate();
    });
  </script>
</body>
</html>
