<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix NFToken Generator</title>
  <meta name="description" content="Ubah cookies Netflix kamu menjadi link login langsung instan">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background-color: #141414;
      color: #ffffff;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
    }

    .header h1 .emoji {
      font-size: 2.5rem;
      margin-right: 0.3rem;
    }

    .header h1 .title-text {
      color: #e50914;
    }

    .header p {
      color: #999;
      font-size: 0.95rem;
    }

    /* Input Section */
    .input-section {
      background-color: #1e1e1e;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .input-section label {
      display: block;
      color: #ccc;
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 0.75rem;
    }

    .input-section textarea {
      width: 100%;
      height: 220px;
      background-color: #0d0d0d;
      color: #4ade80;
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
      padding: 1rem;
      border: 1px solid #444;
      border-radius: 8px;
      resize: none;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-section textarea:focus {
      border-color: #e50914;
    }

    .input-section textarea::placeholder {
      color: #555;
    }

    /* Buttons */
    .buttons {
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
      margin-top: 1rem;
    }

    .btn {
      padding: 0.7rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn-clear {
      background-color: #2a2a2a;
      color: #fff;
      border: 1px solid #555;
    }

    .btn-clear:hover {
      background-color: #3a3a3a;
    }

    .btn-generate {
      background-color: #e50914;
      color: #fff;
    }

    .btn-generate:hover {
      background-color: #b20710;
    }

    .btn-generate:disabled {
      background-color: #5a0509;
      cursor: not-allowed;
    }

    .btn-copy {
      background-color: #16a34a;
      color: #fff;
      padding: 0.6rem 1rem;
      font-size: 0.85rem;
    }

    .btn-copy:hover {
      background-color: #15803d;
    }

    .btn-copy.copied {
      background-color: #166534;
    }

    .btn-open {
      background-color: #2563eb;
      color: #fff;
      padding: 0.6rem 1rem;
      font-size: 0.85rem;
    }

    .btn-open:hover {
      background-color: #1d4ed8;
    }

    /* Result Section */
    .result-section {
      background-color: #1a1a1a;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 1.5rem;
      display: none;
    }

    .result-section.visible {
      display: block;
    }

    .result-section.error {
      background-color: #2a1a1a;
      border-color: #5a1a1a;
    }

    .result-title {
      color: #e50914;
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    .result-label {
      color: #999;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }

    .link-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.2rem;
    }

    .link-input {
      flex: 1;
      background-color: #0d0d0d;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
      padding: 0.75rem 1rem;
      border: 1px solid #444;
      border-radius: 8px;
      outline: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .expiry-value {
      color: #4ade80;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .error-message {
      color: #fca5a5;
      font-size: 0.95rem;
    }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #fff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Footer */
    .footer {
      text-align: center;
      margin-top: 2rem;
      color: #555;
      font-size: 0.75rem;
    }

    .footer p + p {
      margin-top: 0.3rem;
    }

    /* Responsive */
    @media (max-width: 640px) {
      .header h1 {
        font-size: 1.5rem;
      }

      .header h1 .emoji {
        font-size: 1.8rem;
      }

      .buttons {
        flex-direction: column;
      }

      .btn {
        justify-content: center;
      }

      .link-row {
        flex-direction: column;
      }

      .link-input {
        width: 100%;
      }

      .link-row .btn {
        width: 100%;
      }
    }

    /* Scrollbar */
    textarea::-webkit-scrollbar {
      width: 6px;
    }

    textarea::-webkit-scrollbar-track {
      background: #1a1a1a;
    }

    textarea::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 3px;
    }

    textarea::-webkit-scrollbar-thumb:hover {
      background: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1>
        <span class="emoji">🎬</span>
        <span class="title-text">Netflix NFToken Generator</span>
      </h1>
      <p>Ubah cookies Netflix kamu menjadi link login langsung instan</p>
    </div>

    <!-- Input Section -->
    <div class="input-section">
      <label for="cookie-input">Masukkan Cookies Netflix (Raw string, JSON, atau Netscape format):</label>
      <textarea
        id="cookie-input"
        placeholder="Contoh format JSON:
[
  {
    &quot;name&quot;: &quot;NetflixId&quot;,
    &quot;value&quot;: &quot;abc123...&quot;,
    &quot;domain&quot;: &quot;.netflix.com&quot;,
    &quot;path&quot;: &quot;/&quot;,
    &quot;expires&quot;: 1816930582
  }
]

Atau Netscape format:
.netflix.com&#9;TRUE&#9;/&#9;TRUE&#9;1816930582&#9;NetflixId&#9;value_here

Atau Raw string:
NetflixId=abc123; SecureNetflixId=xyz789"></textarea>

      <div class="buttons">
        <button class="btn btn-clear" onclick="handleClear()">Bersihkan</button>
        <button class="btn btn-generate" id="btn-generate" onclick="handleGenerate()">Generate Link 🚀</button>
      </div>
    </div>

    <!-- Result Section -->
    <div class="result-section" id="result-section">
      <div id="result-content"></div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <p>Netflix NFToken Generator - Web Version</p>
      <p>Tool ini hanya untuk tujuan edukasi.</p>
    </div>
  </div>

  <script>
    // ======== Cookie Parsing Logic ========

    /**
     * Parse cookies from various formats:
     * 1. JSON array format (from EditThisCookie / Cookie-Editor)
     * 2. Netscape/Mozilla cookie format (tab-separated)
     * 3. Raw cookie header string (name=value; name2=value2)
     */
    function parseCookies(input) {
      const trimmed = input.trim();

      // Try JSON format first
      if (trimmed.startsWith('[') || trimmed.startsWith('{')) {
        try {
          let parsed = JSON.parse(trimmed);
          if (!Array.isArray(parsed)) {
            parsed = [parsed];
          }
          return parsed.map(cookie => ({
            name: cookie.name || cookie.Name || '',
            value: cookie.value || cookie.Value || '',
            domain: cookie.domain || cookie.Domain || '.netflix.com',
            path: cookie.path || cookie.Path || '/',
            expires: cookie.expires || cookie.expirationDate || cookie.Expires || 0,
            httpOnly: cookie.httpOnly ?? cookie.HttpOnly ?? false,
            secure: cookie.secure ?? cookie.Secure ?? true,
            sameSite: cookie.sameSite || cookie.SameSite || 'Lax',
          }));
        } catch (e) {
          // Not valid JSON, continue
        }
      }

      // Try Netscape format (tab-separated)
      const lines = trimmed.split('\n').filter(line => line.trim() && !line.startsWith('#'));
      if (lines.some(line => line.split('\t').length >= 7)) {
        const cookies = [];
        for (const line of lines) {
          const parts = line.split('\t');
          if (parts.length >= 7) {
            cookies.push({
              name: parts[5].trim(),
              value: parts[6].trim(),
              domain: parts[0].trim(),
              path: parts[2].trim(),
              expires: parseInt(parts[4].trim()) || 0,
              httpOnly: parts[1].trim().toUpperCase() === 'TRUE',
              secure: parts[3].trim().toUpperCase() === 'TRUE',
              sameSite: 'Lax',
            });
          }
        }
        if (cookies.length > 0) return cookies;
      }

      // Try raw cookie header format (name=value; name2=value2)
      if (trimmed.includes('=') && !trimmed.includes('\t')) {
        const pairs = trimmed.split(';').map(p => p.trim()).filter(Boolean);
        const cookies = [];
        for (const pair of pairs) {
          const eqIndex = pair.indexOf('=');
          if (eqIndex > 0) {
            cookies.push({
              name: pair.substring(0, eqIndex).trim(),
              value: pair.substring(eqIndex + 1).trim(),
              domain: '.netflix.com',
              path: '/',
              expires: 0,
              httpOnly: false,
              secure: true,
              sameSite: 'Lax',
            });
          }
        }
        if (cookies.length > 0) return cookies;
      }

      return [];
    }

    /**
     * Generate NFToken from parsed cookies.
     * Base64url-encoded cookie header string.
     */
    function generateNFToken(cookies) {
      // Build cookie string: name=value pairs joined by "; "
      const cookieString = cookies
        .filter(c => c.name && c.value)
        .map(c => `${c.name}=${c.value}`)
        .join('; ');

      // Base64 encode
      const base64 = btoa(unescape(encodeURIComponent(cookieString)));

      // Make URL-safe (base64url)
      const base64url = base64
        .replace(/\+/g, '-')
        .replace(/\//g, '_')
        .replace(/=+$/, '');

      return base64url;
    }

    /**
     * Get the earliest expiry date from cookies
     */
    function getExpiry(cookies) {
      const expiryTimes = cookies
        .map(c => c.expires || c.expirationDate || 0)
        .filter(t => t && t > 0);

      if (expiryTimes.length === 0) return null;

      const earliestExpiry = Math.min(...expiryTimes);
      const date = new Date(earliestExpiry * 1000);

      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      const seconds = String(date.getSeconds()).padStart(2, '0');

      return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
    }

    // ======== UI Handlers ========

    function handleGenerate() {
      const input = document.getElementById('cookie-input').value;
      const resultSection = document.getElementById('result-section');
      const resultContent = document.getElementById('result-content');
      const btnGenerate = document.getElementById('btn-generate');

      if (!input.trim()) {
        resultSection.className = 'result-section visible error';
        resultContent.innerHTML = `
          <h2 class="result-title">Error</h2>
          <p class="error-message">Masukkan cookies terlebih dahulu!</p>
        `;
        return;
      }

      // Show loading
      btnGenerate.disabled = true;
      btnGenerate.innerHTML = '<span class="spinner"></span> Generating...';

      // Small delay for UX
      setTimeout(() => {
        try {
          const parsedCookies = parseCookies(input);

          if (parsedCookies.length === 0) {
            resultSection.className = 'result-section visible error';
            resultContent.innerHTML = `
              <h2 class="result-title">Error</h2>
              <p class="error-message">Gagal parsing cookies. Pastikan format sudah benar (JSON, Netscape, atau Raw string).</p>
            `;
          } else {
            const nftoken = generateNFToken(parsedCookies);
            const link = `https://netflix.com/?nftoken=${nftoken}`;
            const expiry = getExpiry(parsedCookies);

            resultSection.className = 'result-section visible';
            resultContent.innerHTML = `
              <h2 class="result-title">Hasil Generate</h2>
              <p class="result-label">Link Login Otomatis</p>
              <div class="link-row">
                <input type="text" class="link-input" id="link-output" value="${link}" readonly>
                <button class="btn btn-copy" id="btn-copy" onclick="handleCopy()">Salin</button>
                <button class="btn btn-open" onclick="handleOpen()">Buka</button>
              </div>
              <p class="result-label">Masa Berlaku (Expiry)</p>
              <p class="expiry-value">${expiry || 'Tidak diketahui (tidak ada expiry pada cookies)'}</p>
            `;
          }
        } catch (error) {
          resultSection.className = 'result-section visible error';
          resultContent.innerHTML = `
            <h2 class="result-title">Error</h2>
            <p class="error-message">Terjadi kesalahan: ${error.message}</p>
          `;
        }

        // Reset button
        btnGenerate.disabled = false;
        btnGenerate.innerHTML = 'Generate Link 🚀';
      }, 300);
    }

    function handleClear() {
      document.getElementById('cookie-input').value = '';
      const resultSection = document.getElementById('result-section');
      resultSection.className = 'result-section';
      document.getElementById('result-content').innerHTML = '';
    }

    function handleCopy() {
      const linkInput = document.getElementById('link-output');
      const btnCopy = document.getElementById('btn-copy');

      if (linkInput) {
        navigator.clipboard.writeText(linkInput.value).then(() => {
          btnCopy.textContent = 'Tersalin!';
          btnCopy.classList.add('copied');
          setTimeout(() => {
            btnCopy.textContent = 'Salin';
            btnCopy.classList.remove('copied');
          }, 2000);
        }).catch(() => {
          // Fallback
          linkInput.select();
          document.execCommand('copy');
          btnCopy.textContent = 'Tersalin!';
          btnCopy.classList.add('copied');
          setTimeout(() => {
            btnCopy.textContent = 'Salin';
            btnCopy.classList.remove('copied');
          }, 2000);
        });
      }
    }

    function handleOpen() {
      const linkInput = document.getElementById('link-output');
      if (linkInput && linkInput.value) {
        window.open(linkInput.value, '_blank');
      }
    }

    // Allow Ctrl+Enter to generate
    document.addEventListener('keydown', function(e) {
      if (e.ctrlKey && e.key === 'Enter') {
        handleGenerate();
      }
    });
  </script>
</body>
</html>
